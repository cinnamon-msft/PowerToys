name: Manual Multi-Issue Deduplication

on:
  workflow_dispatch:
    inputs:
      since:
        description: "ISO date for earliest issue (e.g. 2023-01-01T00:00:00Z)"
        required: false
        default: '2019-05-05T00:00:00Z'
      max_issues:
        description: "Maximum number of issues to process"
        required: false
        default: 20

jobs:
  fetch-issues:
    runs-on: ubuntu-latest
    outputs:
      issue_numbers: ${{ steps.issues.outputs.issue_numbers }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Fetch Issues
        id: issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SINCE="${{ github.event.inputs.since }}"
          MAX="${{ github.event.inputs.max_issues }}"
          ISSUES=$(gh issue list --state open --limit "$MAX" --search "created:>=$SINCE" --json number --jq '.[].number')
          # Output as JSON array for matrix
          echo "issue_numbers=$(echo $ISSUES | jq -c '.')" >> $GITHUB_OUTPUT

  deduplicate:
    needs: fetch-issues
    runs-on: ubuntu-latest
    strategy:
      matrix:
        issue_number: ${{ fromJson(needs.fetch-issues.outputs.issue_numbers) }}
    steps:
      - name: Deduplicate Issue
        uses: pelikhan/action-genai-issue-dedup@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github_issue: ${{ matrix.issue_number }}
          label-duplicate: "potential duplicate"
          comment-duplicate: true
          close-duplicate: false
          duplicate-comment-template: "This issue appears to be a duplicate of #{duplicate_issue_number}."
